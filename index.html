<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="履修10X">
<title>履修10X｜履修登録を10倍楽に</title>
<style>
:root{
  --bg:#fff;--card:#f2f2f7;--card2:#e9e9ef;--text:#1c1c1e;--sub:#8e8e93;--line:rgba(60,60,67,.14);
  --accent:#fa243c;--accent2:#ff6a7a;--ok:#30b955;--warn:#ff9f0a;--blur:rgba(255,255,255,.78);
  --easy:#34c759;--grow:#0a84ff;--fun:#ff375f;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--text:#fff;--sub:#98989f;--line:rgba(235,235,245,.16);--blur:rgba(28,28,30,.78);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#d8d8de;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--text)}
@media(prefers-color-scheme:dark){html,body{background:#111}}
#app{position:relative;width:min(480px,100vw);height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.18)}
#view{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 190px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
h1{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:6px 0 4px}
h2{font-size:21px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between}
h2 small{font-size:13px;color:var(--accent);font-weight:500}
p{margin:0}
.sub{color:var(--sub);font-size:13px}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
/* tab bar */
#tabs{position:absolute;left:0;right:0;bottom:0;display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 6px);background:var(--blur);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-top:1px solid var(--line);z-index:20}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--sub);font-weight:500}
#tabs button svg{font-size:25px}
#tabs button.on{color:var(--accent)}
/* mini player */
#mini{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 66px);height:58px;border-radius:16px;background:var(--blur);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);box-shadow:0 4px 18px rgba(0,0,0,.14);display:flex;align-items:center;gap:12px;padding:0 14px 0 8px;z-index:19;overflow:hidden}
#mini .art{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--accent),#ff8a5c)}
#mini .t{flex:1;min-width:0}
#mini .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .t span{font-size:12px;color:var(--sub)}
#mini .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .4s}
#mini button{font-size:24px;color:var(--text)}
/* cards */
.card{background:var(--card);border-radius:18px;padding:16px}
.hero{border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,#fa243c 0%,#ff5e62 45%,#ff9966 100%);position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(250,36,60,.28)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.16)}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.9}
.hero .big{font-size:26px;font-weight:800;margin:6px 0 4px;line-height:1.25}
.hero .stats{display:flex;gap:18px;margin:14px 0 16px}
.hero .stats div{font-size:11px;opacity:.9}.hero .stats b{display:block;font-size:22px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;background:var(--accent);color:#fff}
.btn svg{font-size:16px}
.btn.w{background:#fff;color:var(--accent)}
.btn.g{background:var(--card2);color:var(--text)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn.on{background:var(--accent);color:#fff}
/* rows */
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.cover{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:28px;flex:none;box-shadow:0 3px 10px rgba(0,0,0,.14);color:#fff}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{font-size:12px;color:var(--sub)}
.pills{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--card2);white-space:nowrap}
.pill.e{color:var(--easy)}.pill.g{color:var(--grow)}.pill.f{color:var(--fun)}
.row .m .pill.e{color:var(--easy)}.row .m .pill.g{color:var(--grow)}.row .m .pill.f{color:var(--fun)}.row .m .pill.risk{color:var(--warn)}.row .m .pill.cross{color:#af52de}
.pill.risk{background:rgba(255,159,10,.16);color:var(--warn)}.pill.cross{background:rgba(175,82,222,.14);color:#af52de}
.circ{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--card2);color:var(--accent);flex:none}
.circ.on{background:var(--accent);color:#fff}
/* scroll shelf */
.shelf{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.tile{width:140px;flex:none}
.tile .cover{width:140px;height:140px;border-radius:16px;font-size:56px;position:relative}
.tile b{display:block;margin-top:8px;font-size:14px;line-height:1.3}
.tile span{font-size:12px;color:var(--sub)}
.badge{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.38);backdrop-filter:blur(6px);color:#fff}
/* chips / seg */
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -18px 4px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;background:var(--card);font-size:13.5px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.chip.on{background:var(--accent);color:#fff}
.seg{display:flex;background:var(--card);border-radius:11px;padding:3px;margin:10px 0}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--sub);display:flex;justify-content:center;gap:5px;align-items:center}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;margin-top:8px}
.search input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--text)}
.search svg{color:var(--sub);font-size:18px}
/* timetable */
.grid{display:grid;grid-template-columns:26px repeat(5,1fr);gap:5px;margin-top:6px}
.grid .h{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:4px 0}
.grid .p{display:grid;place-items:center;font-size:11px;color:var(--sub);font-weight:700}
.cell{aspect-ratio:.72;border-radius:11px;background:var(--card);display:grid;place-items:center;color:var(--sub);font-size:20px;position:relative;overflow:hidden}
.cell.f{color:#fff;padding:4px;text-align:center;align-content:center;box-shadow:0 3px 8px rgba(0,0,0,.14)}
.cell.f i{font-style:normal;font-size:20px;line-height:1}
.cell.f small{font-size:9.5px;font-weight:700;line-height:1.15;margin-top:3px;display:block;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cell.hl{outline:2px dashed var(--accent)}
.tools{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.pl{display:flex;gap:8px;margin-top:8px}
.pl button{flex:1;padding:10px;border-radius:13px;background:var(--card);font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pl button small{font-weight:500;font-size:10.5px;color:var(--sub)}
.pl button.on{background:var(--accent);color:#fff}.pl button.on small{color:rgba(255,255,255,.85)}
/* bars */
.bar{height:9px;border-radius:9px;background:var(--card2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.wk{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:10px}
.wk div{flex:1;border-radius:6px 6px 3px 3px;background:linear-gradient(var(--accent2),var(--accent));min-height:4px;position:relative}
.wk div.ok{background:linear-gradient(#7be495,var(--easy))}
.wk span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--sub)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--sub);margin-top:26px}
/* sheet */
#ov{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:40}
#ov.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:41;overflow-y:auto;padding:10px 18px calc(env(safe-area-inset-bottom) + 26px);scrollbar-width:none}
#sheet.on{transform:none}
#sheet .grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.dh{display:flex;gap:14px;align-items:center}
.dh .cover{width:84px;height:84px;font-size:42px;border-radius:18px}
.dh h3{font-size:22px;margin:0 0 4px;line-height:1.2}
.rings{display:flex;justify-content:space-around;margin:18px 0 6px}
.ringw{text-align:center;font-size:12px;font-weight:700;color:var(--sub)}
.ringw svg{width:74px;height:74px;display:block;margin:0 auto 4px}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.ai{background:linear-gradient(135deg,rgba(250,36,60,.10),rgba(255,153,102,.14));border-radius:16px;padding:14px;font-size:14px;line-height:1.55;margin-top:14px}
.ai b{display:flex;gap:6px;align-items:center;color:var(--accent);margin-bottom:5px;font-size:13px}
.rv{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.rv .st{color:#ffb300;font-size:12px;letter-spacing:1px}
.rv.lock{filter:blur(5px);user-select:none}
.act{display:flex;gap:8px;margin-top:16px}
.act .btn{flex:1;justify-content:center;padding:13px}
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.in,select.in{width:100%;border:0;border-radius:11px;background:var(--card);padding:11px 12px;font:inherit;font-size:16px;color:var(--text);outline:none}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opts .chip{font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:15px}
/* chat */
.msgs{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.b{max-width:86%;padding:10px 14px;border-radius:19px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.b.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.b.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.pc{align-self:stretch;background:var(--card);border-radius:18px;padding:14px}
.pc .mg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:10px 0}
.pc .mg i{aspect-ratio:1.2;border-radius:4px;background:var(--card2)}
.composer{position:sticky;bottom:128px;display:flex;gap:8px;margin-top:14px;padding:8px 0;background:var(--bg);z-index:5}
.composer input{flex:1}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:19px}
/* toast */
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-90px);background:rgba(30,30,32,.94);color:#fff;border-radius:16px;padding:11px 16px;font-size:14px;font-weight:600;z-index:60;display:flex;gap:12px;align-items:center;transition:.35s cubic-bezier(.2,.9,.3,1.2);max-width:92%}
#toast.on{transform:translate(-50%,0)}
#toast button{color:var(--accent2);font-weight:800}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#fa243c,#ff9966);display:grid;place-items:center;color:#fff;font-size:17px;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center}
.note{font-size:11.5px;color:var(--sub);margin-top:16px;line-height:1.5;text-align:center}
.warn{background:rgba(255,159,10,.14);color:#b36b00;border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:12px;display:flex;gap:8px;line-height:1.45}
@media(prefers-color-scheme:dark){.warn{color:#ffb340}}
.warn.ok{background:rgba(48,185,85,.13);color:#1f8a3b}
table{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
th,td{padding:9px 4px;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left;color:var(--sub)}
td.best{color:var(--accent);font-weight:800}
.ringbig{position:relative;width:170px;height:170px;margin:6px auto}
.ringbig svg{width:170px;height:170px;transform:rotate(-90deg)}
.ringbig div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringbig b{font-size:34px;line-height:1}.ringbig span{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div id="mini"></div>
  <nav id="tabs"></nav>
  <div id="ov"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
</div>
<script>
"use strict";
/* ============ アイコン ============ */
const IC={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 grad:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>',
 spark:'<path d="M11 3l1.9 5.6L18.5 10.5l-5.6 1.9L11 18l-1.9-5.6L3.5 10.5l5.6-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 mark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
 dice:'<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r=".8"/><circle cx="15.5" cy="15.5" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="15.5" cy="8.5" r=".8"/><circle cx="8.5" cy="15.5" r=".8"/>',
 wand:'<path d="M4 20L15 9"/><path d="M14 4l1 2.5L17.5 7.5 15 8.5 14 11l-1-2.5L10.5 7.5 13 6.5z"/><path d="M19 13l.6 1.4L21 15l-1.4.6L19 17l-.6-1.4L17 15l1.4-.6z"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 send:'<path d="M21 3L10 14M21 3l-7 18-4-8-8-4z"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.4 3.4 0 0 1 0 6.4M18.5 14.8c1.7.8 2.7 2.5 3 5.2"/>',
 warn:'<path d="M12 3L2 20h20z"/><path d="M12 10v4.5M12 17.5v.1"/>',
 bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 pen:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/>',
 play:'<path d="M7 4l13 8-13 8z" style="fill:currentColor"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 swap:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
 leaf:'<path d="M5 19C5 10 10 5 20 4c0 10-5 15-14 15z"/><path d="M5 19L13 11"/>',
 rocket:'<path d="M12 3c4 2 6 6 5 11l-3 3h-4l-3-3C6 9 8 5 12 3z"/><circle cx="12" cy="10" r="1.6"/><path d="M8 17l-3 4M16 17l3 4"/>',
 party:'<path d="M4 20l5-14 9 9z"/><path d="M14 4v2M19 8h2M17 3l1 1"/>'
};
const ic=(n,s)=>`<svg viewBox="0 0 24 24"${s?` style="${s}"`:''}>${IC[n]}</svg>`;
/* ============ データ(サンプル) ============ */
const DAYS=['月','火','水','木','金'], TIMES=['9:00','10:45','13:00','14:45','16:30'];
const CAT={lib:'教養',lang:'言語',major:'専門',free:'自由'};
const REQ={lib:20,lang:16,major:64,free:24};
const STYLE={lec:'講義',dis:'ディスカッション',grp:'グループワーク',onl:'オンデマンド',pro:'実践・PBL'};
const GOAL={career:'就活・キャリア',abroad:'留学',cert:'資格取得',research:'研究・ゼミ',startup:'起業',global:'国際理解'};
const PERS={steady:'💪 コツコツ型',challenge:'🚀 チャレンジ型',chill:'🧘 マイペース型',social:'🤝 社交型'};
// [絵文字,講義名,区分,学部,曜,限,形態,A+率,F率,週負荷h,評価,目的,履修者,定員,成長,楽しさ,良い点,難点,タグ]
const RAW=[
['🛍️','マーケティング入門','major','APM',0,0,'dis',22,4,3,'レポート',['career','startup'],118,120,82,78,'事例が多く就活に直結','毎回の予習が必要','マーケ 経営'],
['📊','データ分析基礎','major','APM',1,1,'pro',14,9,4,'試験',['career','research'],95,80,88,55,'Excelで実践的に学べる','数学が苦手だと大変','データ 統計 AI'],
['💰','財務会計入門','major','APM',2,0,'lec',10,14,4,'試験',['cert','career'],140,120,75,40,'簿記資格の土台になる','暗記量が多い','会計 資格'],
['🚀','起業とイノベーション','major','APM',3,2,'pro',30,2,3,'発表',['startup','career'],70,60,90,92,'実際にピッチを作れる','チーム依存度が高い','起業 経営'],
['🌏','アジア国際関係論','major','APS',0,2,'dis',20,5,3,'レポート',['global','research'],60,80,70,70,'議論が活発で視野が広がる','リーディングが多め','国際関係 文化'],

function sc(c){
  const p=S.prof;

  let g=c.g*.85+(c.goals.includes(p.goal)?15:0), fn=c.fn*.9+(p.styles.includes(c.style)?10:0);
  if(p.pers==='challenge')g+=c.g>75?6:0; if(p.pers==='chill')fn+=(c.style==='onl'||c.load<=2)?8:0;

    off:5-days.size,risky:cs.filter(c=>risk(c)>=60).length,peak:Math.max(...wk),avg:Math.round(wk.reduce((a,b)=>a+b,0)/15),wk};
}
function weekLoad(ids){
  const w=Array(15).fill(0);
  ids.map(i=>COURSES[i]).forEach(c=>{

function buildPlan(o={}){
  const p=S.prof,w=o.w||{e:100-p.mode,g:p.mode,f:40},rem=remaining();
  const target=o.target||p.limit-4,blocked=new Set(o.block||[]);
  const val=c=>{const s=sc(c);let v=(w.e*s.easy+w.g*s.g+w.f*s.fn)/(w.e+w.g+w.f);
    (o.tags||[]).forEach(t=>{if(c.tags.includes(t)||c.name.includes(t))v+=30});
    if(o.style&&c.style===o.style)v+=14;
    if(o.goal&&c.goals.includes(o.goal))v+=18;
    v+=rem[ecat(c)]>0?10+Math.min(15,rem[ecat(c)]/4):-25;
    if(risk(c)>=60)v-=14; if(o.jitter)v+=Math.random()*o.jitter; return v};
  if(o.free&&blocked.size<o.free){
    const ds=[0,1,2,3,4].filter(d=>!blocked.has(d)).map(d=>({d,s:COURSES.filter(c=>c.day===d).reduce((a,c)=>a+Math.max(0,val(c)-50),0)})).sort((a,b)=>a.s-b.s);
    while(blocked.size<o.free&&ds.length)blocked.add(ds.shift().d);
  }
  const out=[];let cr=0;
  COURSES.slice().sort((a,b)=>val(b)-val(a)).forEach(c=>{
    if(cr+2>target||blocked.has(c.day)||slotOwner(c.day,c.per,out))return;
    out.push(c.id);cr+=2;
  });
  return out;
}

function filtered(){

function advise(text){
  const o={tags:[],block:[]};let m;
  if(m=text.match(/週\s*(\d)\s*日?\s*(休|オフ)/))o.free=+m[1];
  else if(m=text.match(/週\s*(\d)\s*日?\s*(登校|通学)/))o.free=5-(+m[1]);
  DAYS.forEach((d,i)=>{if(new RegExp(d+'曜?日?(は|を)?(休|オフ|なし|入れ|いらな|避)').test(text))o.block.push(i)});
  const tagSet=new Set(COURSES.flatMap(c=>c.tags));tagSet.forEach(t=>{if(text.includes(t))o.tags.push(t)});
  if(/マーケ/.test(text)&&!o.tags.includes('マーケ'))o.tags.push('マーケ');
  if(/留学|IELTS|TOEFL/i.test(text)){o.goal='abroad';o.tags.push('留学')}
  if(/就活|キャリア|就職/.test(text))o.goal='career';
  if(/起業/.test(text))o.goal='startup';
  if(/資格/.test(text))o.goal='cert';
  if(/ディスカッション|議論/.test(text))o.style='dis';else if(/グループ/.test(text))o.style='grp';else if(/オンライン|オンデマンド/.test(text))o.style='onl';else if(/実践|プロジェクト|ワーク/.test(text))o.style='pro';
  if(m=text.match(/(\d+)\s*単位/))o.target=clamp(+m[1],6,S.prof.limit);
  const easy=/楽|ラク|らく|単位.*(確実|ほしい|欲しい|取りた)|負荷.*(低|軽)/.test(text),grow=/成長|スキル|力をつけ|ガチ|頑張|挑戦|強化/.test(text);
  const base={e:50,g:50,f:40};if(easy&&!grow)Object.assign(base,{e:85,g:15});if(grow&&!easy)Object.assign(base,{e:15,g:85});
  const mk=(title,desc,w)=>({title,desc,ids:buildPlan(Object.assign({},o,{w}))});
  const plans=[mk('🌿 楽さ重視案','A+率が高く、F率・負荷が低い講義を中心に',{e:90,g:10,f:35}),mk('⚖️ バランス案','楽さ・成長・楽しさを均等に',{e:50,g:50,f:40}),mk('🚀 成長重視案','目的に直結するスキル系を中心に',{e:10,g:90,f:35})];
  const cond=[];
  if(o.free)cond.push(`週${o.free}日休み`);if(o.block.length)cond.push(o.block.map(d=>DAYS[d]+'曜').join('・')+'なし');
  if(o.tags.length)cond.push('興味:'+[...new Set(o.tags)].join('・'));if(o.goal)cond.push('目的:'+GOAL[o.goal]);if(o.style)cond.push('形態:'+STYLE[o.style]);if(o.target)cond.push(o.target+'単位');
  const reply=cond.length?`条件を読み取りました ✅\n${cond.join(' / ')}\nこの条件で3つの案を作りました。`:`具体的な条件が読み取れなかったので、プロフィールをもとに3案を作りました。曜日(例:金曜休み)や興味(例:AI、英語)を足すと精度が上がります。`;
  return {reply,plans};
}

   case'star':document.querySelectorAll('#stars .chip').forEach((b,i)=>b.classList.toggle('on',i+1===+t.dataset.n));break;
   case'postrv':{let st=1;document.querySelectorAll('#stars .chip').forEach((b,i)=>{if(b.classList.contains('on'))st=i+1});
     const tx=$('#rtext').value.trim()||'(コメントなし)';(S.reviews[id]=S.reviews[id]||[]).push([st,tx+(($('#grade').value!=='回答しない')?`(成績:${$('#grade').value})`:'')]);S.points+=3;S.unlocked.push(id);save();detail(id);toast('投稿ありがとう! +3pt');break}
   case'chip':S.f.chip=t.dataset.c;render();break;
   case'sort':S.f.sort=t.dataset.s;render();break;
   case'clrslot':S.f.slot=null;render();break;
   case'slot':S.f.slot=[+t.dataset.d,+t.dataset.p];S.f.chip='all';S.f.q='';S.tab='explore';render();$('#view').scrollTop=0;break;
   case'seg':S.seg=t.dataset.s;render();break;
   case'plan':S.cur=+t.dataset.i;save();render();break;
   case'autoplan':S.plans[S.cur]=buildPlan({});save();S.tab='time';S.seg='grid';render();toast('✨ AIが最適な時間割を作りました');break;
   case'gacha':S.plans[S.cur]=buildPlan({jitter:45,w:{e:50,g:50,f:60}});save();render();toast('🎲 新しい時間割ができました!');break;
   case'clear':S.plans[S.cur]=[];save();render();break;
   case'gen3':{S.plans[0]=buildPlan({w:{e:90,g:10,f:35}});S.plans[1]=buildPlan({});S.plans[2]=buildPlan({w:{e:10,g:90,f:35}});save();render();toast('A=楽さ / B=バランス / C=成長 で作成');break}
   case'earn':{const k=t.dataset.k;S.prof.earned[k]=clamp(S.prof.earned[k]+ +t.dataset.d,0,REQ[k]);save();render();break}
   case'ask':S.chat.push({r:'me',t:t.dataset.t});reply(t.dataset.t);break;
   case'send':{const v=$('#ci').value.trim();if(!v)break;S.chat.push({r:'me',t:v});reply(v);break}
   case'apply':{const pl=S.chat[+t.dataset.m].plans[+t.dataset.j];S.plans[S.cur]=pl.ids.slice();save();toast(`${'ABC'[S.cur]}案に適用しました`,'時間割を見る',()=>{S.tab='time';S.seg='grid';render()});render();break}
   case'profile':profileSheet();break;
   case'pset':{let v=t.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;else if(!isNaN(v))v=+v;S.prof[t.dataset.k]=v;profileSheet();break}
   case'pstyle':{const s=S.prof.styles,v=t.dataset.v;S.prof.styles=s.includes(v)?s.filter(x=>x!==v):s.concat(v);profileSheet();break}
   case'psave':S.prof.name=$('#pn').value.trim()||'あなた';S.prof.seen=true;save();closeSheet();render();toast('プロフィールを更新しました');break;
   case'reset':if(confirm('保存データをすべて初期化します。よろしいですか?')){localStorage.removeItem(KEY);S=DEF();closeSheet();init()}break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.f.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.dataset.a==='mode'){S.prof.mode=+e.target.value;$('#modeTx').textContent=modeText(S.prof.mode);save()}
  if(e.target.dataset.a==='plimit'){S.prof.limit=+e.target.value;e.target.previousElementSibling.textContent=`1学期の履修上限:${S.prof.limit}単位`}
});
document.addEventListener('change',e=>{if(e.target.dataset.a==='mode'){render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ci'){const v=e.target.value.trim();if(v){S.chat.push({r:'me',t:v});reply(v)}}});
function reply(text){
  S._scroll=true;render();
  const r=advise(text);
  setTimeout(()=>{S.chat.push({r:'ai',t:r.reply});S.chat.push({plans:r.plans});S._scroll=true;save();render()},550);
}
function init(){
  if(!plan().length&&!S.plans.some(p=>p.length)){S.plans[0]=buildPlan({});S.plans[1]=buildPlan({w:{e:90,g:10,f:35}});S.plans[2]=buildPlan({w:{e:10,g:90,f:35}})}
  const h=location.hash.slice(1).split(':');
  if(h[0]&&TABS.some(t=>t[0]===h[0])){S.tab=h[0];S.prof.seen=true;if(h[1]==='load'||h[1]==='cmp')S.seg=h[1]}
  render();save();
  if(h[0]==='ai'&&h[1]){const q=decodeURIComponent(h[1]);S.chat=[{r:'me',t:q}];const r=advise(q);S.chat.push({r:'ai',t:r.reply},{plans:r.plans});render()}
  if(h[0]==='detail'){S.prof.seen=true;detail(+h[1])}
  if(!S.prof.seen)setTimeout(profileSheet,350);
}
init();
</script>
</body>
</html>
